<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Viewer</title>
<!-- Template for view_tickets.py. It holds no ticket data and loads nothing from the network;
     the script embeds the tickets as JSON in place of the placeholder below. -->
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --fg: #1c2330;
    --muted: #5d6879;
    --line: #dde1e7;
    --accent: #1f5f8b;
    --accent-soft: #e3eef6;
    --alert: #8a5a00;
    --alert-soft: #fbf0d9;
    --bad: #a12a2a;
    --bad-soft: #f8e2e2;
    --good: #1e6b3a;
    --good-soft: #def1e4;
    --mark: #fff1a8;
    --redact: #e9dcf7;
    --redact-fg: #5a2d8c;
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13171d; --panel: #1b2028; --fg: #e2e7ee; --muted: #9aa4b3; --line: #2d3541;
      --accent: #7db6df; --accent-soft: #1f3344; --alert: #f0c060; --alert-soft: #3a2f17;
      --bad: #f09a9a; --bad-soft: #3d2023; --good: #8fd3a5; --good-soft: #1b3324;
      --mark: #5c5115; --redact: #3a2a52; --redact-fg: #d6bdf5;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .open { padding: 2px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer; }
  header .open:hover { border-color: var(--accent); }
  #load-status.bad { color: var(--bad); }
  body.dragging main { outline: 2px dashed var(--accent); outline-offset: -6px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 400px) 1fr; }
  aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
  .filters { display: grid; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
  .filters input, .filters select { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
  .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .count { color: var(--muted); font-size: 12px; }
  ul.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  ul.list li { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 2px; }
  ul.list li:hover { background: var(--bg); }
  ul.list li[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .li-top { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .li-subject { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .li-client { font-size: 12px; color: var(--muted); }

  .chip { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; white-space: nowrap;
          background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .chip.alert { background: var(--alert-soft); border-color: transparent; color: var(--alert); }
  .chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  .chip.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
  .chip.info { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  section.detail { overflow-y: auto; min-width: 0; padding: 16px 20px 40px; display: grid; gap: 16px; align-content: start; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  h2 { margin: 0; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; text-wrap: balance; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
  .card h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  dl.fields { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
  dl.fields dt { color: var(--muted); }
  dl.fields dd { margin: 0; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }

  .text-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
  .stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  pre.text { margin: 0; font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  mark.redacted { background: var(--redact); color: var(--redact-fg); }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--muted); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .rationale { margin: 0; }
  .kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Ticket Viewer</h1>
  <button type="button" class="open" id="open-file" title="Load a .jsonl ticket file from load_export.py, split_alerts.py or fetch_tickets.py; you can also drop it on the page">Open ticket file…</button>
  <input type="file" id="file-input" accept=".jsonl,.ndjson,.json" hidden>
  <span class="meta" id="meta"></span>
  <span class="meta" id="load-status" role="status"></span>
  <span class="meta">Keys: <span class="kbd">j</span>/<span class="kbd">k</span> next/previous, <span class="kbd">/</span> search, <span class="kbd">t</span> toggle text</span>
</header>
<main>
  <aside>
    <div class="filters">
      <input id="q" type="search" placeholder="Search id, subject, client, text, servers" aria-label="Search">
      <div class="filter-row">
        <select id="kind" aria-label="Ticket kind">
          <option value="">Alerts and human</option>
          <option value="alert">Alerts only</option>
          <option value="human">Human only</option>
        </select>
        <select id="ztype" aria-label="Zendesk type"></select>
      </div>
      <div class="filter-row">
        <select id="category" aria-label="Category"></select>
        <select id="client" aria-label="Client"></select>
      </div>
      <select id="alert-name" aria-label="Alert name"></select>
      <select id="pred" aria-label="Prediction" hidden></select>
      <div class="count" id="count"></div>
    </div>
    <ul class="list" id="list" role="listbox" aria-label="Tickets"></ul>
  </aside>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>

<script id="viewer-data" type="application/json">__VIEWER_DATA__</script>
<script>
(function () {
  "use strict";
  // DATA, TICKETS and byId are replaced when a file is opened in the page (see load below).
  let DATA = JSON.parse(document.getElementById("viewer-data").textContent);
  let TICKETS = DATA.tickets;
  let byId = new Map(TICKETS.map(t => [t.ticket_id, t]));
  const RULES = DATA.mask_rules;
  const $ = id => document.getElementById(id);
  const state = { view: "sent", selected: null, shown: [] };

  // Build every element through the DOM so ticket text is never parsed as HTML.
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v; else node.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      node.append(c instanceof Node ? c : String(c));
    }
    return node;
  }
  const chip = (text, cls) => el("span", { class: "chip" + (cls ? " " + cls : "") }, text);
  const fmt = n => Number(n).toLocaleString();
  const weak = (t, key) => (t.weak_labels || {})[key] || "";
  const alertName = t => (t.alert_fields || {}).alert_name || "";
  const prediction = t => t.result && t.result.output;

  // --- Header and filters ---------------------------------------------------
  function fillSelect(select, label, values) {
    select.replaceChildren(el("option", { value: "" }, label));
    const counts = new Map();
    values.forEach(v => { if (v) counts.set(v, (counts.get(v) || 0) + 1); });
    [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]))
      .forEach(([v, n]) => select.append(el("option", { value: v }, `${v} (${n})`)));
  }
  function setupHeaderAndFilters() {
    const alerts = TICKETS.filter(t => t.is_alert === true).length;
    $("meta").textContent = TICKETS.length || DATA.source !== "no file"
      ? `${fmt(TICKETS.length)} tickets from ${DATA.source} (${fmt(alerts)} alerts)` +
        (DATA.run ? ` · run ${DATA.run}` : "") +
        ` · ${DATA.generated_at.startsWith("opened") ? "" : "generated "}${DATA.generated_at}`
      : "No ticket file loaded";
    $("q").value = "";
    $("kind").value = "";
    fillSelect($("ztype"), "Any Zendesk type", TICKETS.map(t => weak(t, "zendesk_type")));
    fillSelect($("category"), "Any category", TICKETS.map(t => weak(t, "category")));
    fillSelect($("client"), "Any client", TICKETS.map(t => t.organization_name));
    fillSelect($("alert-name"), "Any alert name", TICKETS.map(alertName));
    $("alert-name").hidden = !TICKETS.some(alertName);
    const pred = $("pred");
    pred.hidden = !DATA.run;
    pred.replaceChildren(el("option", { value: "" }, "Any prediction"),
                         el("option", { value: "failed" }, "Failed"),
                         el("option", { value: "missing" }, "Not classified"));
    const types = new Map();
    TICKETS.forEach(t => { const p = prediction(t); if (p) types.set(p.primary_type, (types.get(p.primary_type) || 0) + 1); });
    [...types.entries()].sort().forEach(([v, n]) => pred.append(el("option", { value: "type:" + v }, `Predicted ${v} (${n})`)));
  }

  function matches(t) {
    const q = $("q").value.trim().toLowerCase();
    const kind = $("kind").value;
    if (kind === "alert" && t.is_alert !== true) return false;
    if (kind === "human" && t.is_alert !== false) return false;
    if ($("ztype").value && weak(t, "zendesk_type") !== $("ztype").value) return false;
    if ($("category").value && weak(t, "category") !== $("category").value) return false;
    if ($("client").value && t.organization_name !== $("client").value) return false;
    if ($("alert-name").value && alertName(t) !== $("alert-name").value) return false;
    const pv = DATA.run ? $("pred").value : "";
    if (pv === "failed" && !(t.result && t.result.error)) return false;
    if (pv === "missing" && t.result) return false;
    if (pv.startsWith("type:") && !(prediction(t) && prediction(t).primary_type === pv.slice(5))) return false;
    if (!q) return true;
    const hay = [t.ticket_id, t.subject, t.organization_name, t.description, (t.dw_servers || []).join(" "),
                 Object.values(t.weak_labels || {}).join(" ")].join("\n").toLowerCase();
    return hay.includes(q);
  }

  // --- List -------------------------------------------------------------------
  function renderList() {
    state.shown = TICKETS.filter(matches);
    $("count").textContent = `Showing ${fmt(state.shown.length)} of ${fmt(TICKETS.length)}`;
    const frag = document.createDocumentFragment();
    for (const t of state.shown) {
      const p = prediction(t);
      const tags = [
        t.is_alert === true ? chip("alert", "alert") : t.is_alert === false ? chip("human") : null,
        t.result && t.result.error ? chip("failed", "bad") : p ? chip(p.primary_type, "info") : null,
        t.description ? null : chip("no text", "bad"),
      ];
      frag.append(el("li", { role: "option", "data-id": t.ticket_id, "aria-selected": String(t.ticket_id === state.selected) },
        el("div", { class: "li-top" }, "#" + t.ticket_id, " · ", t.created_at || "", tags),
        el("div", { class: "li-subject" }, t.subject || "(no subject)"),
        el("div", { class: "li-client" }, t.organization_name || "(no client)")));
    }
    $("list").replaceChildren(frag);
    if (!state.shown.some(t => t.ticket_id === state.selected)) select(state.shown[0] ? state.shown[0].ticket_id : null);
  }

  $("list").addEventListener("click", e => {
    const li = e.target.closest("li[data-id]");
    if (li) select(li.dataset.id);
  });
  ["q", "kind", "ztype", "category", "client", "alert-name", "pred"].forEach(id => $(id).addEventListener("input", renderList));

  function select(id) {
    state.selected = id;
    for (const li of $("list").children) {
      const on = li.dataset.id === id;
      li.setAttribute("aria-selected", String(on));
      if (on) li.scrollIntoView({ block: "nearest" });
    }
    if (id) history.replaceState(null, "", "#t" + id);
    renderDetail();
  }

  function step(delta) {
    const i = state.shown.findIndex(t => t.ticket_id === state.selected);
    const next = state.shown[Math.min(state.shown.length - 1, Math.max(0, i + delta))];
    if (next) select(next.ticket_id);
  }

  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); return; }
    if (e.key === "Escape" && typing) { document.activeElement.blur(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); step(1); }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); step(-1); }
    if (e.key === "t") { state.view = state.view === "sent" ? "raw" : "sent"; renderDetail(); }
  });

  // --- Detail -----------------------------------------------------------------
  const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  // Text with the search term and [REDACTED] markers highlighted, built as text nodes.
  function highlighted(text) {
    const q = $("q").value.trim();
    const parts = ["\\[REDACTED[^\\]]*\\]"];
    if (q) parts.push(escapeRe(q));
    const re = new RegExp(parts.join("|"), "gi");
    const out = [];
    let last = 0;
    for (const m of text.matchAll(re)) {
      if (m.index > last) out.push(text.slice(last, m.index));
      out.push(el("mark", { class: m[0].startsWith("[REDACTED") ? "redacted" : null }, m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
  }

  function fields(pairs) {
    return el("dl", { class: "fields" },
      pairs.filter(([, v]) => v !== null && v !== undefined && v !== "" && !(Array.isArray(v) && !v.length))
           .flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)]));
  }

  // Fields parsed from the alert text by alert_parser.py (never sent to the model).
  const ALERT_FIELD_ORDER = ["alert_name", "severity", "level", "previous_level", "server", "instance", "platform",
    "db_instance", "job", "env", "alert_id", "open_date", "failures", "ok_collections", "collector", "alias", "keyword",
    "summary", "message", "description", "recommendations"];
  function alertCard(t) {
    const a = t.alert_fields;
    if (!a) return null;
    const keys = [...ALERT_FIELD_ORDER, ...Object.keys(a).filter(k => k !== "family" && k !== "client_name" && !ALERT_FIELD_ORDER.includes(k))];
    const pairs = keys.filter(k => a[k]).map(k => [k.replace(/_/g, " "), a[k]]);
    return el("div", { class: "card" }, el("h3", {}, `Alert fields · ${a.family.replace(/_/g, " ")}`),
      pairs.length ? fields(pairs) : el("div", { class: "stats" }, "No fields are parsed for this alert format."));
  }

  function resultCard(t) {
    const r = t.result;
    if (!DATA.run) return null;
    if (!r) return el("div", { class: "card" }, el("h3", {}, `Run ${DATA.run}`), el("div", { class: "stats" }, "Not classified in this run."));
    const p = r.output;
    const cost = r.estimated_cost_usd != null ? "$" + Number(r.estimated_cost_usd).toFixed(4) : "";
    const usage = [r.input_tokens != null ? `${fmt(r.input_tokens)} in` : "", r.cache_read_input_tokens ? `${fmt(r.cache_read_input_tokens)} cached` : "",
                   r.output_tokens != null ? `${fmt(r.output_tokens)} out` : "", r.latency_ms != null ? `${fmt(r.latency_ms)} ms` : "", cost]
                  .filter(Boolean).join(" · ");
    const card = el("div", { class: "card" }, el("h3", {}, `Run ${DATA.run}`));
    if (r.error) card.append(el("div", { class: "chips" }, chip("failed: " + r.error, "bad"), r.stop_category ? chip(r.stop_category, "bad") : null));
    if (p) {
      card.append(fields([
        ["Primary type", el("span", { class: "chips" }, chip(p.primary_type, "info"), ...(p.secondary_types || []).map(s => chip(s)))],
        ["Intent", p.intent],
        ["Confidence", p.confidence],
        ["Zendesk category", weak(t, "category")],
      ]));
      card.append(el("p", { class: "rationale" }, p.rationale));
      const rows = (r.matches || []).map(m => el("tr", {},
        el("td", {}, m.text), el("td", {}, m.kind),
        el("td", {}, chip(m.status, m.status === "matched" ? "good" : m.status === "ambiguous" ? "alert" : null)),
        el("td", {}, (m.server_names || []).join(", "))));
      (r.dropped_mention_details || []).forEach(m => rows.push(el("tr", {},
        el("td", {}, m.text), el("td", {}, m.kind), el("td", {}, chip("quote not in ticket", "bad")), el("td", {}, m.evidence_quote))));
      card.append(rows.length
        ? el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, el("tr", {}, ["Mention", "Kind", "CMDB", "Servers or quote"].map(h => el("th", {}, h)))), el("tbody", {}, rows)))
        : el("div", { class: "stats" }, "No server or instance mentions returned."));
    }
    card.append(el("div", { class: "stats" }, [r.served_model || r.model, r.fallback_used ? "fallback used" : "", usage].filter(Boolean).join(" · ")));
    return card;
  }

  function renderDetail() {
    const t = byId.get(state.selected);
    if (!t) {
      $("detail").replaceChildren(el("div", { class: "empty" }, TICKETS.length ? "No ticket matches the filters."
        : "Open a .jsonl ticket file with the button above, or drop one on the page."));
      return;
    }
    const sent = state.view === "sent";
    const text = sent ? t.sent_description : t.description;
    const chars = (t.sent_subject || "").length + (t.sent_description || "").length;
    const labels = Object.entries(t.weak_labels || {});
    const dwFields = Object.entries(t.dw_fields || {}).filter(([, v]) => v);

    const viewBtn = (value, label) => {
      const b = el("button", { type: "button", "aria-pressed": String(state.view === value) }, label);
      b.addEventListener("click", () => { state.view = value; renderDetail(); });
      return b;
    };

    // resultCard is null without --run; replaceChildren would show it as the text "null"
    $("detail").replaceChildren(...[
      el("h2", {}, highlighted(sent ? t.sent_subject : t.subject || "(no subject)")),
      el("div", { class: "card" }, fields([
        ["Ticket", "#" + t.ticket_id],
        ["Client", t.organization_name],
        ["Zendesk org id", t.organization_id],
        ["Created", t.created_at],
        ["Kind", t.is_alert === true ? chip("alert", "alert") : t.is_alert === false ? chip("human") : ""],
        ["Weak labels", labels.length ? el("span", { class: "chips" }, labels.map(([k, v]) => chip(`${k}: ${v}`))) : ""],
        ["DW2.0 servers", (t.dw_servers || []).join(", ")],
        ["DW2.0 fields", dwFields.length ? el("span", { class: "chips" }, dwFields.map(([k, v]) => chip(`${k}: ${v}`))) : ""],
        ["Tags", (t.tags || []).join(", ")],
        ["Source", t.source],
      ])),
      alertCard(t),
      resultCard(t),
      el("div", { class: "card" },
        el("div", { class: "text-bar" },
          el("div", { class: "seg", role: "group", "aria-label": "Text version" }, viewBtn("sent", "As sent to model"), viewBtn("raw", "As exported")),
          el("span", { class: "stats" },
            `${fmt(chars)} characters sent · about ${fmt(Math.ceil(chars / 4))} tokens · ` +
            `${t.secrets_masked} secret${t.secrets_masked === 1 ? "" : "s"} masked`)),
        text ? el("pre", { class: "text" }, highlighted(text)) : el("div", { class: "stats" }, "This ticket has no description."))
    ].filter(Boolean));
  }

  // --- Opening another file ----------------------------------------------------
  // NODE-TESTED-START. Masking and parsing for a file opened in the page, with no page access, so
  // tests/test_viewer.py can run this block in Node and compare it with Python. The rules are common.py's
  // own patterns, embedded by view_tickets.py, so a file opened here is masked exactly as classify.py would.
  function compileRule(r) { return { re: new RegExp(r.source, r.flags), replacement: r.replacement }; }

  function maskText(text, secretRules, tagRule) {
    let masked = 0;
    for (const r of secretRules) {
      masked += [...text.matchAll(r.re)].length;
      text = text.replace(r.re, r.replacement);
    }
    return [text.replace(tagRule.re, tagRule.replacement), masked];
  }
  const SECRET_RULES = RULES.secrets.map(compileRule);
  const TAG_RULE = compileRule(RULES.prompt_tags);

  // The same fields view_tickets.py adds: the text as classify.py would send it. A file opened here
  // carries no run results.
  function viewerTicket(t) {
    const [subject, n1] = maskText(String(t.subject || ""), SECRET_RULES, TAG_RULE);
    const [description, n2] = maskText(String(t.description || ""), SECRET_RULES, TAG_RULE);
    return { ...t, ticket_id: String(t.ticket_id).trim(), sent_subject: subject, sent_description: description,
             secrets_masked: n1 + n2, result: null };
  }

  function parseTickets(name, text) {
    if (/\.csv$/i.test(name)) throw new Error("This is a CSV export. Run load_export.py on it first, then open the .jsonl file it writes.");
    let items, skipped = 0;
    if (/\.json$/i.test(name)) {
      const data = JSON.parse(text);
      items = Array.isArray(data) ? data : data.tickets || [];
    } else {
      items = [];
      for (const line of text.split(/\r?\n/)) {
        if (!line.trim()) continue;
        try { items.push(JSON.parse(line)); } catch { skipped++; }
      }
    }
    const tickets = [];
    for (const t of items) {
      if (t && typeof t === "object" && t.ticket_id !== undefined && t.ticket_id !== null && String(t.ticket_id).trim()) tickets.push(viewerTicket(t));
      else skipped++;
    }
    return { tickets, skipped };
  }
  // NODE-TESTED-END

  function load(data) {
    DATA = data;
    TICKETS = data.tickets;
    byId = new Map(TICKETS.map(t => [t.ticket_id, t]));
    setupHeaderAndFilters();
    state.selected = null;
    history.replaceState(null, "", location.pathname + location.search);
    renderList();
  }

  function setStatus(text, bad) {
    $("load-status").textContent = text;
    $("load-status").className = "meta" + (bad ? " bad" : "");
  }

  // The file is read in this browser only; nothing is uploaded or saved.
  async function openFile(file) {
    if (!file) return;
    setStatus(`Reading ${file.name}…`);
    try {
      const { tickets, skipped } = parseTickets(file.name, await file.text());
      if (!tickets.length) throw new Error(`No tickets with a ticket_id in ${file.name}.`);
      load({ source: file.name, run: null, generated_at: "opened " + new Date().toLocaleString(), tickets });
      setStatus(skipped ? `${fmt(skipped)} unreadable line${skipped === 1 ? "" : "s"} skipped` : "", skipped > 0);
    } catch (err) {
      setStatus(err instanceof SyntaxError ? `${file.name} is not valid JSON.` : err.message, true);
    }
  }

  $("open-file").addEventListener("click", () => $("file-input").click());
  $("file-input").addEventListener("change", e => { openFile(e.target.files[0]); e.target.value = ""; });
  let dragDepth = 0;
  document.addEventListener("dragenter", e => { if (e.dataTransfer.types.includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
  document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove("dragging");
    openFile(e.dataTransfer.files[0]);
  });

  // --- Start ------------------------------------------------------------------
  setupHeaderAndFilters();
  const fromHash = location.hash.startsWith("#t") ? location.hash.slice(2) : null;
  state.selected = byId.has(fromHash) ? fromHash : null;
  renderList();
  if (state.selected) select(state.selected);
})();
</script>
</body>
</html>
