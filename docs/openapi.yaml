    EntraBearer:
      type: http
      description: An Entra ID access token for the API's app registration, carrying the required app role (AUTH_MODE=entra).
      scheme: bearer
      bearerFormat: JWT
tags:
- name: analysis
  description: Server detection and taxonomy classification of one ticket.
- name: catalog
  description: The keys and enumerated values responses can contain.
- name: probes
  description: Liveness and readiness for the container platform; no auth.
