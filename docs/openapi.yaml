components:
  schemas:
    AlertInfo:
      properties:
        family:
          type: string
          title: Family
          description: The alert family.
          examples:
          - collector
        layout:
          anyOf:
          - type: string
          - type: 'null'
          title: Layout
          description: The alert layout.
          examples:
          - collector_labeled
        alertName:
          type: string
          title: Alertname
          description: The alert name parsed from the text.
          examples:
          - FD - SQL Agent Job Failure
        tableEntry:
          anyOf:
          - $ref: '#/components/schemas/AlertTableEntry'
          - type: 'null'
          description: The alert-name table row, when the table has the name.
      type: object
      required:
      - family
      - layout
      - alertName
      - tableEntry
      title: AlertInfo
      description: The monitoring alert the parser recognized in the text.
    AlertTableEntry:
      properties:
        type:
          type: string
          title: Type
          description: The type the table gives.
          examples:
          - scheduled_jobs
        decides:
          type: string
          title: Decides
          description: 'Whether the name decides the type: Yes, Partly or No.'
          examples:
          - Partly
        tickets:
          type: integer
          title: Tickets
          description: Alert tickets with this name when the table was made.
          examples:
          - 1259
      type: object
      required:
      - type
      - decides
      - tickets
      title: AlertTableEntry
      description: |-
        The alert-name table row (alert_types.json) the alert matched, by exact name or name pattern. The
        table's free-text note is not returned: it was written from real tickets.
    AnalyzeResponse:
      properties:
        requestId:
          type: string
          title: Requestid
          description: The request id, also in the X-Request-Id header.
          examples:
          - 3f2b8c1e9a7d4e6f8b0c2d4e6f8a0b1c
        apiVersion:
          type: string
          title: Apiversion
          description: The API contract version.
          examples:
          - 1.0.0
        ticketId:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticketid
          description: The caller's ticketId, echoed; null when not given.
          examples:
          - '12345'
        models:
          $ref: '#/components/schemas/ModelVersions'
          description: The model and directory versions that produced the response.
        detection:
          $ref: '#/components/schemas/DetectionResult'
          description: What POST /v1/detect returns, without the envelope.
        taxonomy:
          $ref: '#/components/schemas/ClassificationResult'
          description: What POST /v1/classify returns, without the envelope.
      type: object
      required:
      - requestId
      - apiVersion
      - models
      - detection
      - taxonomy
      title: AnalyzeResponse
      description: 'The response of POST /v1/analyze: both bodies without their own envelope fields.'
    Candidate:
      properties:
        id:
          type: string
          title: Id
          description: A type or intent id.
          examples:
          - access_security
        p:
          type: number
          title: P
          description: The model's probability.
          examples:
          - 0.33
      type: object
      required:
      - id
      - p
      title: Candidate
      description: A type or intent the model considered, with its probability.
    CatalogResponse:
      properties:
        requestId:
          type: string
          title: Requestid
          description: The request id, also in the X-Request-Id header.
          examples:
          - 3f2b8c1e9a7d4e6f8b0c2d4e6f8a0b1c
        apiVersion:
          type: string
          title: Apiversion
          description: The API contract version.
          examples:
          - 1.0.0
        ticketId:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticketid
          description: The caller's ticketId, echoed; null when not given.
          examples:
          - '12345'
        models:
          $ref: '#/components/schemas/ModelVersions'
          description: The model and directory versions that produced the response.
        taxonomyVersion:
          type: string
          title: Taxonomyversion
          description: The taxonomy the types and intents belong to.
          examples:
          - v1-draft
        alertTableVersion:
          type: string
          title: Alerttableversion
          description: The alert-name table's version.
          examples:
          - '1'
        detectionKeys:
          items:
            $ref: '#/components/schemas/DetectionKey'
          type: array
          title: Detectionkeys
          description: The detection keys.
        detectionFields:
          items:
            $ref: '#/components/schemas/DetectionField'
          type: array
          title: Detectionfields
          description: Every field of a detection.
        types:
          items:
            $ref: '#/components/schemas/TaxonomyEntry'
          type: array
          title: Types
          description: The taxonomy's types.
        intents:
          items:
            $ref: '#/components/schemas/TaxonomyEntry'
          type: array
          title: Intents
          description: The taxonomy's intents.
        typeSources:
          items:
            $ref: '#/components/schemas/Described'
          type: array
          title: Typesources
          description: Every typeSource value, including rule:<name> per keyword rule.
        intentSources:
          items:
            $ref: '#/components/schemas/Described'
          type: array
          title: Intentsources
          description: Every intentSource value.
      type: object
      required:
      - requestId
      - apiVersion
      - models
      - taxonomyVersion
      - alertTableVersion
      - detectionKeys
      - detectionFields
      - types
      - intents
      - typeSources
      - intentSources
      title: CatalogResponse
      description: 'The response of GET /v1/catalog: every key and enumerated value the responses can contain.'
    ClassificationResult:
      properties:
        primaryType:
          type: string
          title: Primarytype
          description: The taxonomy type id.
          examples:
          - access_security
        typeSource:
          type: string
          title: Typesource
          description: 'Where the type came from: model, alert_name, alert_name_partly, alert_default or rule:<name>.'
          examples:
          - rule:access_request
        typeCandidates:
          items:
            $ref: '#/components/schemas/Candidate'
          type: array
          title: Typecandidates
          description: The model's top types, highest first.
        intent:
          type: string
          title: Intent
          description: The taxonomy intent id.
          examples:
          - request_change
        intentSource:
          type: string
          title: Intentsource
          description: 'Where the intent came from: model or alert_rule.'
          examples:
          - model
        intentCandidates:
          items:
            $ref: '#/components/schemas/Candidate'
          type: array
          title: Intentcandidates
          description: The model's top intents, highest first.
        uncertain:
          type: boolean
          title: Uncertain
          description: True when the model decided the type with low confidence or a close second; check by hand.
          examples:
          - false
        uncertainReason:
          type: string
          title: Uncertainreason
          description: Why it is uncertain; empty otherwise.
          examples:
          - ''
        alert:
          anyOf:
          - $ref: '#/components/schemas/AlertInfo'
          - type: 'null'
          description: The parsed alert, for alerts; null otherwise.
        notes:
          items:
            type: string
          type: array
          title: Notes
          description: Remarks on the result, such as an alert name the table does not decide.
          examples:
          - []
        debug:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Debug
          description: 'Only with DEBUG_RESPONSES on a local run: the cleaned text and each rule''s result.'
      type: object
      required:
      - primaryType
      - typeSource
      - typeCandidates
      - intent
      - intentSource
      - intentCandidates
      - uncertain
      - uncertainReason
      - alert
      - notes
      title: ClassificationResult
      description: The taxonomy type and intent of one ticket.
    ClassifyResponse:
      properties:
        requestId:
          type: string
          title: Requestid
          description: The request id, also in the X-Request-Id header.
          examples:
          - 3f2b8c1e9a7d4e6f8b0c2d4e6f8a0b1c
        apiVersion:
          type: string
          title: Apiversion
          description: The API contract version.
          examples:
          - 1.0.0
        ticketId:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticketid
          description: The caller's ticketId, echoed; null when not given.
          examples:
          - '12345'
        models:
          $ref: '#/components/schemas/ModelVersions'
          description: The model and directory versions that produced the response.
        primaryType:
          type: string
          title: Primarytype
          description: The taxonomy type id.
          examples:
          - access_security
        typeSource:
          type: string
          title: Typesource
          description: 'Where the type came from: model, alert_name, alert_name_partly, alert_default or rule:<name>.'
          examples:
          - rule:access_request
        typeCandidates:
          items:
            $ref: '#/components/schemas/Candidate'
          type: array
          title: Typecandidates
          description: The model's top types, highest first.
        intent:
          type: string
          title: Intent
          description: The taxonomy intent id.
          examples:
          - request_change
        intentSource:
          type: string
          title: Intentsource
          description: 'Where the intent came from: model or alert_rule.'
          examples:
          - model
        intentCandidates:
          items:
            $ref: '#/components/schemas/Candidate'
          type: array
          title: Intentcandidates
          description: The model's top intents, highest first.
        uncertain:
          type: boolean
          title: Uncertain
          description: True when the model decided the type with low confidence or a close second; check by hand.
          examples:
          - false
        uncertainReason:
          type: string
          title: Uncertainreason
          description: Why it is uncertain; empty otherwise.
          examples:
          - ''
        alert:
          anyOf:
          - $ref: '#/components/schemas/AlertInfo'
          - type: 'null'
          description: The parsed alert, for alerts; null otherwise.
        notes:
          items:
            type: string
          type: array
          title: Notes
          description: Remarks on the result, such as an alert name the table does not decide.
          examples:
          - []
        debug:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Debug
