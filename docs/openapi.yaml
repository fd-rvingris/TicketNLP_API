      required:
      - id
      - label
      - definition
      title: TaxonomyEntry
      description: A taxonomy type or intent from taxonomy.json.
    TicketRequest:
      properties:
        text:
          type: string
          maxLength: 200000
          minLength: 1
          title: Text
          description: 'The ticket text: its description or first comment, 1 to 200,000 characters. The detector
            reads the first 20,000 characters and the classifier the first 8,000.'
          examples:
          - FAKESQL01 is down since 06:00.
        subject:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Subject
          description: The ticket subject, up to 1,000 characters. Optional, but alerts and several rules are recognized
            by it.
          examples:
          - Slow reports
        zendeskOrgId:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: string
            pattern: ^\d{1,20}$
          - type: 'null'
          title: Zendeskorgid
          description: The Zendesk organization id of the ticket's client, as a string of digits or an integer.
            The detector resolves names against that client's known servers and instances only; missing or unknown,
            no client's names apply. The taxonomy classifier ignores it.
          examples:
          - 999001
        ticketId:
          anyOf:
          - type: string
            maxLength: 256
          - type: integer
          - type: 'null'
          title: Ticketid
          description: The caller's own ticket id, echoed back for correlation. Not used and not logged.
          examples:
          - '12345'
      additionalProperties: false
      type: object
      required:
      - text
      title: TicketRequest
      description: One ticket. Unknown fields are refused, so a misspelt zendeskOrgId is not silently ignored.
      examples:
      - subject: Slow reports
        text: The REPORTS instance on FAKESQL01 is slow since this morning. FAKESQL02\FINANCE is fine.
        zendeskOrgId: '999001'
  securitySchemes:
    ApiKeyAuth:
