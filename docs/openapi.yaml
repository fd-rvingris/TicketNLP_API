        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - type: 'null'
          title: Errors
          description: For 422, each field that failed validation.
      type: object
      required:
      - title
      - status
      - code
      - apiVersion
      title: Problem
      description: RFC 9457 problem details (application/problem+json). Never repeats the request's text.
    Status:
      properties:
        status:
          type: string
          title: Status
          description: ok for /health, ready for /ready.
          examples:
          - ok
      type: object
      required:
      - status
      title: Status
      description: A probe's answer.
    TaxonomyEntry:
      properties:
        id:
          type: string
          title: Id
          description: The id responses carry.
          examples:
          - access_security
        label:
          type: string
          title: Label
          description: A short label.
          examples:
          - Access and security
        definition:
          type: string
          title: Definition
          description: The taxonomy's definition.
          examples:
          - Logins, users, roles and permissions.
