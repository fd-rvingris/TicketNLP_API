    Detection:
      properties:
        key:
          type: string
          title: Key
          description: 'The entity type: host, instance (a bare instance name) or host_instance.'
          examples:
          - host_instance
        value:
          type: string
          title: Value
          description: 'The name: lower case, without domain or port, corrected when status is typo_of_known; HOST\INSTANCE
            for host_instance.'
          examples:
          - fakesql02\finance
        text:
          type: string
          title: Text
          description: The name as written, the text at field[start:end].
          examples:
          - FAKESQL02\FINANCE
        host:
          anyOf:
          - type: string
          - type: 'null'
          title: Host
          description: The host; for a bare instance, the host it was paired with, if any.
          examples:
          - fakesql02
        instance:
          anyOf:
          - type: string
          - type: 'null'
          title: Instance
          description: The named instance, if any.
          examples:
          - finance
        status:
          type: string
          title: Status
          description: How the name resolved against the client's known names.
          examples:
          - known
        field:
          type: string
          title: Field
          description: 'Where the name is: subject or description.'
          examples:
          - description
        start:
          type: integer
          title: Start
          description: Start offset in the field, in characters.
          examples:
          - 62
        end:
          type: integer
          title: End
          description: End offset in the field, in characters (exclusive).
          examples:
          - 79
        typoOf:
          anyOf:
          - type: string
          - type: 'null'
          title: Typoof
          description: The known name this one is a typo of (status typo_of_known).
          examples:
          - null
        siblingOf:
          anyOf:
          - type: string
          - type: 'null'
          title: Siblingof
          description: A known name that differs only in trailing digits.
          examples:
          - null
        hostCandidates:
          items:
            type: string
          type: array
          title: Hostcandidates
          description: For an ambiguous bare instance, the client's hosts that have it.
          examples:
          - []
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
          description: The environment the CMDB or alerts give for the host.
          examples:
          - Production
        score:
          type: number
          title: Score
          description: The detector's score for this name, 0 to 1.
          examples:
          - 0.95
      type: object
      required:
      - key
      - value
      - text
      - host
      - instance
      - status
      - field
      - start
      - end
      - typoOf
      - siblingOf
      - hostCandidates
      - environment
      - score
      title: Detection
      description: One occurrence of a server or instance name in the ticket.
    DetectionField:
