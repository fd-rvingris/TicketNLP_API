      tags:
      - catalog
      summary: Keys and values
      description: Every detection key and field with its enumerated values, the taxonomy's types and intents, and
        the type and intent sources (including each keyword rule), generated from the code and taxonomy.json. Lists
        no client's names.
      operationId: catalog_v1_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '400':
