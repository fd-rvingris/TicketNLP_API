        code:
          type: string
          title: Code
          description: A stable machine-readable reason.
          examples:
          - validation_error
        requestId:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestid
          description: The request id, as in X-Request-Id.
          examples:
          - 3f2b8c1e9a7d4e6f8b0c2d4e6f8a0b1c
        apiVersion:
          type: string
