openapi: 3.1.0
info:
  title: Ticket Analysis API
  description: |
    Finds the SQL Server hosts and instances a Fortified Data support ticket names, resolved against the
    client's known names, and classifies the ticket's taxonomy type and intent. One ticket per request.
    Callers: Keystone and other applications.

    **Versioning.** The URL version (/v1) changes only for breaking changes. Within v1, changes are
    additive: new optional request fields, new response fields and new enum values (new types, intents,
    statuses, sources or rule names). Clients must ignore response fields they do not know and accept
    enum values they do not know; `GET /v1/catalog` lists the current values. Every response carries
    `apiVersion` and a `models` object with the model and directory versions that produced it; models
    are retrained and the directory refreshed without an API change.

    **Auth.** Send an API key in `X-API-Key` (ApiKeyAuth) or an Entra ID bearer token (EntraBearer),
    whichever the deployment is configured for. `/health` and `/ready` need neither.

    **Errors** are RFC 9457 problem details (`application/problem+json`) with a stable `code`. They
    never repeat the request's text. Bodies are limited to 1 MB.

    **Data.** Ticket text is analyzed in memory and never stored or logged.
  version: 1.0.0
paths:
  /v1/detect:
    post:
      tags:
      - analysis
      summary: Detect servers and instances
      description: The hosts, bare instance names and HOST\INSTANCE names in one ticket, as a compact `entities`
        view and one `detections` entry per occurrence. With `zendeskOrgId`, names are resolved against that client's
        known servers and instances.
      operationId: detect_v1_detect_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRequest'
            examples:
              access_request:
                summary: Access request email (rule:access_request)
                value:
                  text: "CAUTION: This email originated from outside of the organization. Do not click links or\
                    \ open attachments unless you recognize the sender and know the content is safe.\r\n\r\nHi Fortified\
                    \ Data Support,\r\n\r\nCould you please help me get READ access for the schema below, Server=FAKESQL01,\
                    \ Database=FAKE_DB, for the execution user CORP\\svc-fake-batch. Please approve.\r\n\r\nThanks,\r\
                    \nJane Doe\r\nData Engineer | Fake Co\r\n"
                  subject: READ access request
                  zendeskOrgId: 999001
                  ticketId: '12345'
              servers:
                summary: A host, a bare instance and a HOST\INSTANCE name
                value:
                  text: The REPORTS instance on FAKESQL01 is slow since this morning. FAKESQL02\FINANCE is fine.
                  subject: Slow reports
                  zendeskOrgId: '999001'
              alert:
                summary: A collector alert (alert-name table)
                value:
                  text: |
                    AlertId 123456
                    Alert FD - SQL Agent Job Failure
                    Client Name Fake Co
                    Server FAKESQL01
                    Platform Microsoft SQL Server
                    Instance Job: Nightly Load, Category: Data
                    Message Error: The job failed.
                    Severity Warning
                    Level Failure
                    PreviousLevel OK
                    Open Date 07/21/2026 17:00:00 UTC
                  subject: 'Fake Co - Alert #42 - FD - SQL Agent Job Failure'
                  zendeskOrgId: '999001'
              text_only:
                summary: 'Text only: no subject and no client'
                value:
                  text: Disk space is low on the data drive of FAKESQL01.
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectResponse'
        '400':
          description: The body is not valid JSON.
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No or invalid credentials.
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Valid credentials without the required app role.
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The body is larger than 1 MB.
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: The body is not application/json.
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The body does not match the schema.
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: An internal error.
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The models are not loaded yet.
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ApiKeyAuth: []
      - EntraBearer: []
